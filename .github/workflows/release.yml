# Pushing a tag like "v1.0.1" checks the version numbers, lints the PHP files,
# builds the installable ZIP and publishes it as a GitHub release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that tag and plugin version match
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER="$(sed -n 's/^ \* Version: *//p' ean-isbn-barcodes.php | tr -d '[:space:]')"
          CONSTANT="$(sed -n "s/^define( 'EANBC_VERSION', '\(.*\)' );/\1/p" ean-isbn-barcodes.php)"
          STABLE="$(sed -n 's/^Stable tag: *//p' readme.txt | tr -d '[:space:]')"
          echo "tag=$TAG header=$HEADER constant=$CONSTANT readme=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONSTANT" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Tag v$TAG does not match the plugin version (header $HEADER, constant $CONSTANT, readme $STABLE)."
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build ZIP
        run: bash bin/build-zip.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/ean-isbn-barcodes-$VERSION.zip" \
            --title "EAN & ISBN Barcodes $VERSION" \
            --generate-notes
